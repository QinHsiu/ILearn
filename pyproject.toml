[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilearn"
version = "0.1.0"
description = "Personalized learning agent MVP for elementary math (grades 4-6)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "streamlit>=1.32",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ilearn = "ilearn.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ilearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
