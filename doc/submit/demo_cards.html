<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ILearn Demo Card</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #f5f8ff;
      background: linear-gradient(135deg, #002FA7 0%, #0b1a3a 55%, #06101f 100%);
    }
    .wrap { min-height: 100%; box-sizing: border-box; padding: 56px 72px; }
    .kicker { letter-spacing: .18em; opacity: .75; font-size: 20px; margin-bottom: 14px; }
    h1 { font-size: 48px; margin: 0 0 16px; }
    h2 { font-size: 34px; margin: 0 0 20px; color: #9ec5ff; }
    p, li { font-size: 24px; line-height: 1.65; }
    .badge { display: inline-block; padding: 8px 16px; border-radius: 999px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); margin-right: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 22px; }
    th, td { border-bottom: 1px solid rgba(255,255,255,.18); padding: 14px 10px; text-align: left; }
    th { color: #9ec5ff; font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 24px; }
    .card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px; padding: 22px; }
    .card strong { display: block; font-size: 28px; margin-bottom: 8px; }
    .muted { opacity: .85; }
    .big { font-size: 64px; margin: 0 0 12px; }
    .subtitle { position: fixed; left: 0; right: 0; bottom: 48px; text-align: center;
      font-size: 32px; font-weight: 600; text-shadow: 0 2px 12px rgba(0,0,0,.55); }
    .logo-title { font-size: 72px; font-weight: 700; margin: 40px 0 12px; }
    .logo-sub { font-size: 36px; opacity: .9; }
    .triplet { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-top: 28px; }
    .triplet .card h3 { font-size: 30px; margin: 0 0 10px; color: #cfe0ff; }
    .triplet .card .pct { font-size: 42px; font-weight: 700; margin: 8px 0; }
    .bars { display: flex; align-items: flex-end; gap: 36px; height: 280px; margin: 40px 0 20px; padding: 0 40px; }
    .bar-col { flex: 1; text-align: center; }
    .bar { width: 100%; border-radius: 10px 10px 0 0; background: linear-gradient(180deg,#6ea8ff,#165DFF); margin: 0 auto 8px; }
    .bar.before { opacity: .55; height: var(--h); max-width: 80px; }
    .bar.after { height: var(--h2); max-width: 80px; background: linear-gradient(180deg,#7dffb0,#00b368); }
    .bar-wrap { display: flex; justify-content: center; gap: 10px; align-items: flex-end; height: 220px; }
    .arch-flow { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
    .arch-flow span { padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); font-size: 20px; }
    .arch-arrow { opacity: .6; align-self: center; font-size: 24px; }
  </style>
</head>
<body>
