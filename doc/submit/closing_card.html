<!DOCTYPE html>

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 1200px; }
    .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px; padding: 28px 32px; }
    .card h2 { margin: 0 0 12px; font-size: 26px; color: #9ec5ff; }
    .card p { margin: 0; font-size: 22px; line-height: 1.55; opacity: 0.95; }

      <div class="card">

        <p>GitHub: QinHsiu/ILearn<br/>60 秒启动前后端<br/>一条闭环：测评→批改→诊断→规划→巩固</p>
      </div>
    </div>
    <p class="foot">感谢评委，欢迎指正。</p>
  </div>
</body>
</html>
